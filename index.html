<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KMC Connect — Kangaroo Mother Care</title>
  <meta name="description" content="Kangaroo Mother Care training for healthcare providers and a multilingual guide and tracker for parents.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KMC Connect">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="icons/icon-192.png" alt=""><span id="brandTag">KMC Connect</span></a>
    <a id="timerpill" class="timerpill" href="#/">⏱</a>
    <select id="topLang" aria-label="Language">
      <option value="en">EN</option><option value="ms">BM</option><option value="zh">中文</option>

  </header>

  <main id="app" aria-live="polite">
    <noscript><p>KMC Connect needs JavaScript to run.</p></noscript>
  </main>

  <nav id="bottomnav" class="bottomnav hidden" aria-label="Main"></nav>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/content-parent.js"></script>
  <script src="js/content-hcp.js"></script>
  <script src="js/app.js"></script>

</html>
